name: CI

on:
  push:
    branches: [main, "build/**", "design/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Golden component spike
        run: soliddesign golden --out /tmp/soliddesign-golden
      - name: Verify artifacts and safety invariants
        run: |
          test -s /tmp/soliddesign-golden/preview.html
          test -s /tmp/soliddesign-golden/print_pack.html
          test -s /tmp/soliddesign-golden/site_config.json
          test -s /tmp/soliddesign-golden/design_profile.json
          grep -q 'noindex,nofollow,noarchive' /tmp/soliddesign-golden/preview.html
          ! grep -qi '<form' /tmp/soliddesign-golden/preview.html
          ! grep -Eqi 'linear-gradient|radial-gradient' /tmp/soliddesign-golden/preview.html
      - name: Operator static safety
        run: |
          node --check operator/app.js
          test -s operator/index.html
          test -s operator/config.js
          grep -q 'noindex,nofollow,noarchive' operator/index.html
          grep -q 'supabasePublishableKey' operator/config.js
          ! grep -R -E 'SUPABASE_(SERVICE_ROLE|SECRET)_KEY|service_role' operator/ --exclude=README.md
      - name: Impeccable deterministic design gate
        run: |
          npx --yes impeccable@3.6.0 detect --json /tmp/soliddesign-golden/preview.html > /tmp/impeccable.json
          test -s /tmp/impeccable.json
          test "$(cat /tmp/impeccable.json)" = "[]"
