name: CI

on:
  push:
    branches: [main, "build/**", "design/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Golden component spike
        run: soliddesign golden --out /tmp/soliddesign-golden
      - name: Verify artifacts and safety invariants
        run: |
          test -s /tmp/soliddesign-golden/preview.html
          test -s /tmp/soliddesign-golden/print_pack.html
          test -s /tmp/soliddesign-golden/site_config.json
          test -s /tmp/soliddesign-golden/design_profile.json
          grep -q 'noindex,nofollow,noarchive' /tmp/soliddesign-golden/preview.html
          ! grep -qi '<form' /tmp/soliddesign-golden/preview.html
          ! grep -Eqi 'linear-gradient|radial-gradient' /tmp/soliddesign-golden/preview.html
      - name: Operator static safety
        run: |
          node --check operator/app.js
          node --check operator/prospect-link.js
          node --check operator/team-work.js
          node --check operator/prospect-preparation.js
          node --check operator/design-process.js
          node --check operator/discovery-sectors.js
          node --check operator/discovery-triage.js
          node --check operator/discovery.js
          node --check 'operator/functions/[slug].js'
          node --check 'operator/functions/p/[[path]].js'
          node --check 'operator/functions/prospect/[[path]].js'
          node --check operator/functions/api/geocode.js
          node --check operator/functions/api/site-check.js
          node --check operator/functions/api/resolve-sector.js
          node --check operator/functions/api/publish-sector-intelligence.js
          node --check operator/functions/api/prepare-prospect.js
          python -m py_compile scripts/prepare_prospect.py src/soliddesign/preparation.py
          test -s operator/index.html
          test -s operator/start-design.html
          test -s operator/config.js
          test -s operator/team-work.css
          test -s operator/discovery.css
          test -s operator/wrangler.jsonc
          test -s docs/DECISIONS.md
          test -s docs/INTEGRATED_OPERATING_ARCHITECTURE.md
          test -s docs/decisions/20260829_DOMAIN_AGNOSTIC_PUBLIC_AND_CMS_ORIGINS.md
          test -s docs/DISCOVERY_SECTOR_RESOLUTION.md
          test -s docs/DISCOVERY_TRIAGE.md
          test -s docs/FIRST_CONCEPT_PREPARATION.md
          test -s sector-intelligence/README.md
          test -s supabase/functions/prospect-preparation/index.ts
          test -s supabase/migrations/20260826_discovery_archive_v01.sql
          test -s supabase/migrations/20260827_discovery_triage_v01.sql
          test -s supabase/migrations/20260828_first_concept_preparation_v01.sql
          test -s supabase/migrations/20260829_integrated_multiuser_foundation_v01.sql
          test -s supabase/migrations/20260829_operator_rpc_execute_hardening_v01.sql
          test -s supabase/migrations/20260829_assignment_workflow_v01.sql
          test -s .github/workflows/prepare-prospect.yml
          test -s prompts/SOLIDDESIGN_BOOTSTRAP.md
          grep -q 'noindex,nofollow,noarchive' operator/index.html
          grep -q 'noindex,nofollow,noarchive' operator/start-design.html
          grep -q 'supabasePublishableKey' operator/config.js
          grep -q 'publicProspectOrigin' operator/config.js
          grep -q 'publicProspectPathPrefix' operator/config.js
          grep -q '/prospect' operator/config.js
          grep -q 'prospect_assignments' operator/team-work.js
          grep -q 'operator_set_assignment' operator/team-work.js
          grep -q 'team_members' supabase/migrations/20260829_integrated_multiuser_foundation_v01.sql
          grep -q 'actor_user_id' supabase/migrations/20260829_integrated_multiuser_foundation_v01.sql
          grep -q 'operator_set_assignment' supabase/migrations/20260829_assignment_workflow_v01.sql
          grep -q 'cms.<brand>.nl' docs/INTEGRATED_OPERATING_ARCHITECTURE.md
          grep -q '<brand>.nl/<public_slug>' docs/decisions/20260829_DOMAIN_AGNOSTIC_PUBLIC_AND_CMS_ORIGINS.md
          grep -q 'prompts/SOLIDDESIGN_BOOTSTRAP.md' operator/start-design.html
          grep -q 'Prompt architecture version: 0.2' operator/start-design.html
          grep -q 'operator_ingest_discovery_candidates' supabase/migrations/20260826_discovery_archive_v01.sql
          grep -q 'operator_promote_discovery_candidate' supabase/migrations/20260827_discovery_triage_v01.sql
          grep -q 'operator_set_discovery_triage' supabase/migrations/20260827_discovery_triage_v01.sql
          grep -q 'operator_queue_first_concept' supabase/migrations/20260828_first_concept_preparation_v01.sql
          grep -q "stukadoor: \['plasterer'\]" operator/discovery-sectors.js
          grep -q "bakker: \['bakery'\]" operator/discovery-sectors.js
          grep -q "kapper: \['barber'\]" operator/discovery-sectors.js
          grep -q '/api/resolve-sector' operator/discovery-sectors.js
          grep -q '/api/publish-sector-intelligence' operator/discovery-sectors.js
          grep -q 'discovery-triage.js' operator/discovery-sectors.js
          grep -q 'startSectorIntelligence' operator/discovery-sectors.js
          grep -q 'Start sectoronderzoek in ChatGPT' operator/discovery-sectors.js
          grep -q 'Verwerk onderzoeksresultaat' operator/discovery-sectors.js
          grep -q 'human_sector_term' operator/discovery-sectors.js
          grep -q 'sectorIntelligencePrompt' operator/discovery-sectors.js
          ! grep -q 'github.com/solidprivacy-nl/soliddesign' operator/discovery-sectors.js
          grep -q 'GITHUB_SECTOR_INTELLIGENCE_TOKEN' operator/functions/api/publish-sector-intelligence.js
          grep -q 'operator_allowlist' operator/functions/api/publish-sector-intelligence.js
          grep -q 'refs/heads/' operator/functions/api/publish-sector-intelligence.js
          grep -q 'REQUIRED_HEADINGS' operator/functions/api/publish-sector-intelligence.js
          grep -q 'LINKHUB_HOSTS' operator/functions/api/site-check.js
          grep -q "site_kind: 'LINKHUB'" operator/functions/api/site-check.js
          grep -q 'Alleen een linkhub aangetroffen' operator/functions/api/site-check.js
          grep -q '/api/prepare-prospect' operator/discovery-triage.js
          grep -q 'Technisch rapport en eerste mock-up worden voorbereid' operator/discovery-triage.js
          grep -q 'discovery-triage-v1' operator/functions/api/site-check.js
          grep -q 'Voeg toe aan Prospects' operator/discovery-triage.js
          grep -q 'Verbeterkans' operator/discovery-triage.js
          grep -q 'Basischeck OK' operator/discovery-triage.js
          grep -q 'AANBEVOLEN' operator/discovery-triage.js
          grep -q 'LAGE PRIORITEIT' operator/discovery-triage.js
          grep -q 'triage-score' operator/discovery.css
          grep -q 'candidate-more-panel' operator/discovery.css
          grep -q 'prospectDecisionSignals' operator/app.js
          grep -q 'Basischeck probleem' operator/app.js
          grep -q 'prospect-signal' operator/styles.css
          grep -q 'Start eerste beoordeling en mock-up' operator/prospect-preparation.js
          grep -q 'Probeer voorbereiding opnieuw' operator/prospect-preparation.js
          grep -q 'prospect-preparation.js' operator/index.html
          grep -q 'operator_queue_first_concept' operator/functions/api/prepare-prospect.js
          grep -q 'repository_dispatch' .github/workflows/prepare-prospect.yml
          grep -q 'prepare_prospect' .github/workflows/prepare-prospect.yml
          grep -q 'prospect-preparation' scripts/prepare_prospect.py
          grep -q 'linkhub-presence' src/soliddesign/preparation.py
          grep -q 'No `preparation_jobs` table' docs/FIRST_CONCEPT_PREPARATION.md
          grep -q 'overture_categories.csv' operator/functions/api/resolve-sector.js
          grep -q 'workers_ai_validated' operator/functions/api/resolve-sector.js
          grep -q '"binding": "AI"' operator/wrangler.jsonc
          grep -q 'discovery-sectors.js' operator/index.html
          grep -q 'Kopieer verbeteropdracht met sectorinzichten' operator/index.html
          grep -q 'Kopieer startinstructie voor ChatGPT' operator/index.html
          grep -q 'copySectorUpgrade' operator/index.html
          grep -q 'sectorUpgradeStart' operator/design-process.js
          grep -q 'Canonical sector key' operator/design-process.js
          grep -q 'sector-intelligence/<canonical_sector_key>.md' prompts/SOLIDDESIGN_BOOTSTRAP.md
          grep -q 'Ontology identifies; market language guides research' sector-intelligence/README.md
          grep -q '## CMS launcher and operator flow' sector-intelligence/README.md
          grep -q 'canonical v0.4' sector-intelligence/README.md
          grep -q 'ADR-016' docs/DECISIONS.md
          ! grep -q 'Copy SI-verbeterstart' operator/index.html
          ! grep -R -E 'SUPABASE_(SERVICE_ROLE|SECRET)_KEY|service_role' operator/ --exclude=README.md
      - name: Operator Pages Function
        working-directory: operator
        run: |
          npx --yes wrangler@4 pages functions build functions --outfile /tmp/operator-pages-functions.js
          test -s /tmp/operator-pages-functions.js
      - name: Impeccable deterministic design gate
        run: |
          npx --yes impeccable@3.6.0 detect --json /tmp/soliddesign-golden/preview.html > /tmp/impeccable.json
          test -s /tmp/impeccable.json
          test "$(cat /tmp/impeccable.json)" = "[]"
