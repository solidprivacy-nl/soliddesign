name: CI

on:
  push:
    branches: [main, "build/**", "design/**", "chore/**", "ux/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Golden component spike
        run: soliddesign golden --out /tmp/soliddesign-golden
      - name: Verify artifacts and safety invariants
        run: |
          test -s /tmp/soliddesign-golden/preview.html
          test -s /tmp/soliddesign-golden/print_pack.html
          test -s /tmp/soliddesign-golden/site_config.json
          test -s /tmp/soliddesign-golden/design_profile.json
          grep -q 'noindex,nofollow,noarchive' /tmp/soliddesign-golden/preview.html
          ! grep -qi '<form' /tmp/soliddesign-golden/preview.html
          ! grep -Eqi 'linear-gradient|radial-gradient' /tmp/soliddesign-golden/preview.html
      - name: Operator static safety
        run: |
          set -euo pipefail
          node --check operator/app.js
          node --check operator/prospect-link.js
          node --check operator/team-work.js
          node --check operator/prospect-preparation.js
          node --check operator/design-process.js
          node --check operator/design-detail-ui.js
          node --check operator/discovery-sectors.js
          node --check operator/discovery-triage.js
          node --check operator/discovery.js
          node --check operator/prompt-invocation.js
          node --check operator/prompt-library.js
          node --check operator/research-discovery.js
          node --check operator/qualification-display.js
          node --check 'operator/functions/[slug].js'
          node --check 'operator/functions/p/[[path]].js'
          node --check 'operator/functions/prospect/[[path]].js'
          node --check operator/functions/_shared/github-repo.js
          node --check operator/functions/api/_middleware.js
          node --check operator/functions/api/geocode.js
          node --check operator/functions/api/site-check.js
          node --check operator/functions/api/resolve-sector.js
          node --check operator/functions/api/prompt-library.js
          node --check operator/functions/api/prepare-prospect.js
          python -m py_compile scripts/prepare_prospect.py src/soliddesign/preparation.py

          test -s operator/index.html
          test -s operator/start-design.html
          test -s operator/config.js
          test -s operator/team-work.css
          test -s operator/discovery.css
          test -s operator/prompt-library.css
          test -s operator/wrangler.jsonc
          test -s docs/DECISIONS.md
          test -s docs/INTEGRATED_OPERATING_ARCHITECTURE.md
          test -s docs/PROMPT_LIBRARY.md
          test -s docs/DISCOVERY.md
          test -s docs/DISCOVERY_OVERTURE.md
          test -s docs/DISCOVERY_SECTOR_RESOLUTION.md
          test -s docs/PROSPECT_FIRST_DESIGN.md
          test -s docs/DESIGN_BRIEF.md
          test ! -e docs/DISCOVERY_TRIAGE.md
          test ! -e docs/SECTOR_INTELLIGENCE_LINKAGE.md
          test ! -e operator/sector-intelligence-ui.js
          test ! -e operator/sector-link-suggestions.js
          test ! -e operator/functions/api/sector-intelligence.js
          test ! -e sector-intelligence/README.md
          test ! -e prompts/sectors/README.md

          test -s docs/decisions/20260829_DOMAIN_AGNOSTIC_PUBLIC_AND_CMS_ORIGINS.md
          test -s docs/FIRST_CONCEPT_PREPARATION.md
          test -s supabase/functions/prospect-preparation/index.ts
          test -s supabase/migrations/20260826_discovery_archive_v01.sql
          test -s supabase/migrations/20260827_discovery_triage_v01.sql
          test -s supabase/migrations/20260828_first_concept_preparation_v01.sql
          test -s supabase/migrations/20260829_integrated_multiuser_foundation_v01.sql
          test -s supabase/migrations/20260829_operator_rpc_execute_hardening_v01.sql
          test -s supabase/migrations/20260829_assignment_workflow_v01.sql
          test -s supabase/migrations/20260831_prospect_sector_identity_v01.sql
          test -s supabase/migrations/20260831_sector_linking_rpc_v01.sql
          test -s supabase/migrations/20260831_sector_identity_ingest_v02.sql
          test -s supabase/migrations/20260831_sector_linking_security_v03.sql
          test -s supabase/migrations/20260908_research_discovery_import_v01.sql
          test -s supabase/migrations/20260909_retire_sector_linking_v01.sql
          test -s prompts/contracts/prospect-research-import-v1.json
          test -s prompts/library/prospect-research.md
          test -s prompts/library/website-design.md
          test -s .github/workflows/prepare-prospect.yml
          test -s prompts/SOLIDDESIGN_BOOTSTRAP.md

          grep -q 'noindex,nofollow,noarchive' operator/index.html
          grep -q 'noindex,nofollow,noarchive' operator/start-design.html
          grep -q 'supabasePublishableKey' operator/config.js
          grep -q 'publicProspectOrigin' operator/config.js
          grep -q 'publicProspectPathPrefix' operator/config.js
          grep -q '/prospect' operator/config.js
          grep -q 'DOMContentLoaded' operator/config.js
          grep -q 'prospect_assignments' operator/team-work.js
          grep -q 'operator_set_assignment' operator/team-work.js
          grep -q 'team_members' supabase/migrations/20260829_integrated_multiuser_foundation_v01.sql
          grep -q 'actor_user_id' supabase/migrations/20260829_integrated_multiuser_foundation_v01.sql
          grep -q 'operator_set_assignment' supabase/migrations/20260829_assignment_workflow_v01.sql
          grep -q 'cms.<brand>.nl' docs/INTEGRATED_OPERATING_ARCHITECTURE.md
          grep -q '<brand>.nl/<public_slug>' docs/decisions/20260829_DOMAIN_AGNOSTIC_PUBLIC_AND_CMS_ORIGINS.md

          # Prospect-first Design boundary.
          grep -q 'Kopieer designopdracht' operator/index.html
          grep -q 'Designinstructie' operator/index.html
          grep -q 'Projectinstellingen' operator/index.html
          grep -q 'Upload concept' operator/index.html
          grep -q 'Gebruik externe conceptlink' operator/index.html
          ! grep -q 'Sectoronderzoek' operator/index.html
          ! grep -q 'copySectorUpgrade' operator/index.html
          ! grep -q 'sector-intelligence-ui.js' operator/index.html
          ! grep -q 'sector-link-suggestions.js' operator/index.html
          ! grep -q 'canonical_sector_key' operator/design-process.js
          ! grep -qi 'sector-intelligence' operator/design-process.js
          ! grep -q 'operator_set_prospect_sector' operator/design-detail-ui.js
          ! grep -q 'canonical_sector_key' operator/design-detail-ui.js
          grep -q 'Brief format version:.*0.4' operator/design-process.js
          grep -q 'Prompt architecture version.*0.4' prompts/SOLIDDESIGN_BOOTSTRAP.md
          grep -q 'Design the actual prospect' prompts/SOLIDDESIGN_BOOTSTRAP.md
          ! grep -qi 'sector-intelligence' prompts/SOLIDDESIGN_BOOTSTRAP.md
          ! grep -q 'prompts/sectors' prompts/SOLIDDESIGN_BOOTSTRAP.md
          grep -q 'Prompt architecture version: 0.4' operator/start-design.html
          ! grep -qi 'Sector Intelligence' operator/start-design.html
          grep -q 'drop function if exists public.operator_set_prospect_sector' supabase/migrations/20260909_retire_sector_linking_v01.sql
          grep -q 'drop function if exists public.operator_list_sector_link_targets' supabase/migrations/20260909_retire_sector_linking_v01.sql
          grep -q 'Sector may participate in Discovery but never determines prospect Design' docs/INTEGRATED_OPERATING_ARCHITECTURE.md
          grep -q 'Design the actual prospect, not an abstract sector' docs/PROSPECT_FIRST_DESIGN.md

          # Discovery remains sector-aware where required.
          grep -q "stukadoor: \['plasterer'\]" operator/discovery-sectors.js
          grep -q "bakker: \['bakery'\]" operator/discovery-sectors.js
          grep -q "kapper: \['barber'\]" operator/discovery-sectors.js
          grep -q '/api/resolve-sector' operator/discovery-sectors.js
          grep -q 'SOLIDDESIGN_RESOLVE_SINGLE_SECTOR' operator/discovery-sectors.js
          grep -q 'discovery-triage.js' operator/discovery-sectors.js
          ! grep -q 'sectorIntelligencePrompt' operator/discovery-sectors.js
          grep -q 'canonical_sector_key: context.canonicalKey' operator/research-discovery.js
          grep -q 'overture_categories.csv' operator/functions/api/resolve-sector.js
          grep -q 'workers_ai_validated' operator/functions/api/resolve-sector.js
          grep -q '"binding": "AI"' operator/wrangler.jsonc

          # Discovery UX baseline.
          grep -q 'data-discovery-mode="research"' operator/index.html
          grep -q 'data-discovery-mode="area"' operator/index.html
          grep -q 'data-discovery-mode="url"' operator/index.html
          grep -q 'Gericht zoeken' operator/index.html
          grep -q 'Breed zoeken' operator/index.html
          grep -q 'Bekend bedrijf' operator/index.html
          ! grep -q 'Max. resultaten' operator/index.html
          ! grep -q 'Zoek nieuwe prospects' operator/index.html
          ! grep -q 'Controleer een website' operator/index.html
          grep -q '1. Kopieer opdracht' operator/research-discovery.js
          grep -q '2. Importeer resultaat' operator/research-discovery.js
          grep -q 'enriched_count' operator/research-discovery.js
          grep -q '/api/prepare-prospect' operator/discovery-triage.js
          grep -q 'discovery-triage-v1' operator/functions/api/site-check.js
          grep -q 'Toevoegen' operator/discovery-triage.js
          grep -q 'Waarom?' operator/discovery-triage.js
          grep -q 'row.qualification?.research' operator/discovery-triage.js
          grep -q 'KANSRIJK' operator/discovery-triage.js
          grep -q 'NOG BEOORDELEN' operator/discovery-triage.js
          grep -q 'LAGE PRIORITEIT' operator/discovery-triage.js
          grep -q 'collapsed: true' operator/discovery-triage.js
          ! grep -q 'Voeg toe aan Prospects' operator/discovery-triage.js
          ! grep -q 'Bekijk beoordeling' operator/discovery-triage.js
          ! grep -q 'Basischeck OK' operator/discovery-triage.js
          ! grep -q 'triage-score' operator/discovery.css
          grep -q 'candidate-more-panel' operator/discovery.css

          # Existing operational boundaries.
          grep -q 'prospectDecisionSignals' operator/app.js
          grep -q 'Basischeck probleem' operator/app.js
          grep -q 'prospect-signal' operator/styles.css
          grep -q 'Start eerste beoordeling en mock-up' operator/prospect-preparation.js
          grep -q 'Probeer voorbereiding opnieuw' operator/prospect-preparation.js
          grep -q 'prospect-preparation.js' operator/index.html
          grep -q 'operator_queue_first_concept' operator/functions/api/prepare-prospect.js
          grep -q 'repository_dispatch' .github/workflows/prepare-prospect.yml
          grep -q 'prepare_prospect' .github/workflows/prepare-prospect.yml
          grep -q 'prospect-preparation' scripts/prepare_prospect.py
          grep -q 'linkhub-presence' src/soliddesign/preparation.py
          grep -q 'No `preparation_jobs` table' docs/FIRST_CONCEPT_PREPARATION.md
          grep -q 'Nog niet uitgevoerd' operator/qualification-display.js

          # Prompt Library / research boundaries.
          grep -q "const ROOT = 'prompts/library'" operator/functions/api/prompt-library.js
          grep -q "member.role !== 'ADMIN'" operator/functions/api/prompt-library.js
          grep -q "url.pathname === '/api/prompt-library'" operator/functions/api/_middleware.js
          grep -q 'productie-CMS' operator/functions/api/_middleware.js
          grep -q "prompts.copy('prospect-research'" operator/research-discovery.js
          grep -q "run_type: 'IMPORT'" operator/research-discovery.js
          grep -q "discovery_source: 'research'" operator/research-discovery.js
          grep -q 'papaparse@5.7.0' operator/research-discovery.js
          grep -q 'qualification.research' docs/DISCOVERY.md
          grep -q 'qualification.triage' docs/DISCOVERY.md
          grep -q 'Technical acceptance — verified' docs/DISCOVERY.md
          grep -q 'one candidate boundary, one Discovery Inbox, one human decision' docs/DISCOVERY.md
          ! grep -q 'GOOGLE_PLACES_API_KEY' .env.example
          grep -q "'AREA','URL','IMPORT'" supabase/migrations/20260908_research_discovery_import_v01.sql

          ! grep -Eqi 'github\.com|raw\.githubusercontent\.com|api\.github\.com' operator/start-design.html
          ! grep -Eqi 'github\.com|raw\.githubusercontent\.com|api\.github\.com' prompts/SOLIDDESIGN_BOOTSTRAP.md
          ! grep -Eqi 'github\.com|raw\.githubusercontent\.com|api\.github\.com' operator/design-process.js
          ! grep -q 'operator_allowlist remains' README.md
          ! grep -q 'operator_allowlist remains' docs/ARCHITECTURE.md
          ! grep -R -E 'SUPABASE_(SERVICE_ROLE|SECRET)_KEY|service_role' operator/ --exclude=README.md
      - name: Operator Pages Function
        working-directory: operator
        run: |
          npx --yes wrangler@4 pages functions build functions --outfile /tmp/operator-pages-functions.js
          test -s /tmp/operator-pages-functions.js
      - name: Impeccable deterministic design gate
        run: |
          npx --yes impeccable@3.6.0 detect --json /tmp/soliddesign-golden/preview.html > /tmp/impeccable.json
          test -s /tmp/impeccable.json
          test "$(cat /tmp/impeccable.json)" = "[]"
