      - name: Assemble five premium concepts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, time
          root=pathlib.Path('gate3-work')
          project='soliddesign-previews-solidprivacy'
          branch='gate3-v1'
          report={'prospects':[]}
          for slug in ('koppen','e-install','energiek','jansen','akta'):
              d=root/slug
              opaque=(d/'opaque.txt').read_text().strip()
              url=f'https://{branch}.{project}.pages.dev/p/{opaque}/'
              out=d/'proof'
              started=time.monotonic()
              p=subprocess.run(['soliddesign','assemble','--prospect',str(d/'prospect.json'),'--audit',str(d/'audit.json'),'--score',str(d/'score.json'),'--out',str(out),'--preview-url',url],capture_output=True,text=True)
              seconds=round(time.monotonic()-started,3)
              if p.returncode:
                  raise SystemExit(f'assemble failed for {slug}: {p.stderr}')
              payload=json.loads(p.stdout)
              report['prospects'].append({'slug':slug,'qualification_score':payload['qualification_score'],'build_seconds':seconds,'opaque_id':opaque,'preview_url':url})
          (root/'report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Deterministic design and safety gate
        shell: bash
        run: |
          set -euo pipefail
          for slug in koppen e-install energiek jansen akta; do
            html="gate3-work/$slug/proof/preview.html"
            test -s "$html"
            grep -q 'noindex,nofollow,noarchive' "$html"
            ! grep -qi '<form' "$html"
            ! grep -Eqi 'linear-gradient|radial-gradient' "$html"
            npx impeccable detect --json "$html" > "gate3-work/$slug/impeccable.json"
            python - "$slug" <<'PY'
          import json, pathlib, sys
          slug=sys.argv[1]
          findings=json.loads(pathlib.Path(f'gate3-work/{slug}/impeccable.json').read_text())
          if findings:
              raise SystemExit(f'Impeccable findings for {slug}: {findings}')
          PY
          done
      - name: Screenshot desktop and mobile
        run: |
          cat > gate3-work/screenshot.mjs <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'url';
          import path from 'path';
          const browser = await chromium.launch({headless:true});
          for (const slug of ['koppen','e-install','energiek','jansen','akta']) {
            const file=path.resolve(`gate3-work/${slug}/proof/preview.html`);
            for (const [size,width,height] of [['desktop',1440,1000],['mobile',390,844]]) {
              const page=await browser.newPage({viewport:{width,height}});
              await page.goto(pathToFileURL(file).href);
              await page.screenshot({path:`gate3-work/${slug}/${size}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          JS
          node gate3-work/screenshot.mjs
      - name: Deploy one static preview tree
        run: |
          set -euo pipefail
          mkdir -p deploy
          cat > deploy/index.html <<'HTML'
          <!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><title>SolidDesign Gate 3</title></head><body><p>Niet-geïndexeerde conceptomgeving.</p></body></html>
          HTML
          for slug in koppen e-install energiek jansen akta; do
            opaque=$(cat "gate3-work/$slug/opaque.txt")
            mkdir -p "deploy/p/$opaque"
            cp "gate3-work/$slug/proof/preview.html" "deploy/p/$opaque/index.html"
          done
          npx wrangler pages deploy deploy --project-name "$PROJECT_NAME" --branch "$PREVIEW_BRANCH" --commit-hash "$GITHUB_SHA" --commit-message "Gate 3 five-prospect premium proof" | tee gate3-work/wrangler.out
      - name: Verify live previews
        shell: bash
        run: |
          set -euo pipefail
          for slug in koppen e-install energiek jansen akta; do
            opaque=$(cat "gate3-work/$slug/opaque.txt")
            url="https://${PREVIEW_BRANCH}.${PROJECT_NAME}.pages.dev/p/$opaque/"
            ok=0
            for i in $(seq 1 12); do
              code=$(curl -A 'Mozilla/5.0 SolidDesign Gate3 verification' -sS -o "gate3-work/$slug/live.html" -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ] && grep -q 'noindex,nofollow,noarchive' "gate3-work/$slug/live.html"; then ok=1; break; fi
              sleep 5
            done
            test "$ok" -eq 1
          done
      - name: Final aggregate
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('gate3-work')
          report=json.loads((root/'report.json').read_text())
          report['all_impeccable_clean']=all(json.loads((root/p['slug']/'impeccable.json').read_text())==[] for p in report['prospects'])
          report['all_live_verified']=all((root/p['slug']/'live.html').exists() for p in report['prospects'])
          report['total_build_seconds']=round(sum(p['build_seconds'] for p in report['prospects']),3)
          (root/'report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
