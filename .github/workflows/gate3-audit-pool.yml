name: Gate 3 reserve audit

on:
  push:
    branches: ["gate3/audit-pool"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen Pitch Doctor only
        run: |
          set -euo pipefail
          git clone https://github.com/NezbiT/pitch-doctor.git /tmp/pitch-doctor
          git -C /tmp/pitch-doctor checkout ab5858c5ba620fccde1fa2fd35e2c2ca86d37a42
          python -m venv /tmp/pitch-doctor/.venv
          /tmp/pitch-doctor/.venv/bin/python -m pip install --upgrade pip
          /tmp/pitch-doctor/.venv/bin/pip install -e /tmp/pitch-doctor
          /tmp/pitch-doctor/.venv/bin/playwright install --with-deps chromium

      - name: Audit Overture reserve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reserve/akta
          /tmp/pitch-doctor/.venv/bin/pitch-doctor scan \
            http://www.aktaelektra.nl \
            --business-name "Akta Elektra" \
            --city "Utrecht" \
            --lang en \
            --out reserve/akta \
            --json \
            > reserve/akta/stdout.txt \
            2> reserve/akta/stderr.txt
          test -n "$(find reserve/akta -name '*.json' -print -quit)"

      - name: Upload reserve audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate3-reserve-akta
          path: reserve
          retention-days: 14
