name: Gate 3 five-prospect proof

on:
  push:
    branches: ["gate3/audit-pool"]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: soliddesign-previews-solidprivacy
      PREVIEW_BRANCH: gate3-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Verify bounded deployment authorization
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install
        run: |
          python -m pip install -e .
          npm install --no-save wrangler@4.126.0 playwright@1.59.1 impeccable@3.6.0
          npx playwright install --with-deps chromium
