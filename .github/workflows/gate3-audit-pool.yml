name: Gate 3 audit pool

on:
  push:
    branches: ["gate3/audit-pool"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen Pitch Doctor only
        run: |
          set -euo pipefail
          python -m pip install -e .
          git clone https://github.com/NezbiT/pitch-doctor.git /tmp/pitch-doctor
          git -C /tmp/pitch-doctor checkout ab5858c5ba620fccde1fa2fd35e2c2ca86d37a42
          python -m venv /tmp/pitch-doctor/.venv
          /tmp/pitch-doctor/.venv/bin/python -m pip install --upgrade pip
          /tmp/pitch-doctor/.venv/bin/pip install -e /tmp/pitch-doctor
          /tmp/pitch-doctor/.venv/bin/playwright install --with-deps chromium
          /tmp/pitch-doctor/.venv/bin/pitch-doctor --help >/dev/null

      - name: Audit candidate pool and preserve raw donor output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-pool/raw
          cat > audit-pool/candidates.json <<'JSON'
          [
            {"slug":"koppen","name":"Koppen Electro Techniek","city":"Vleuten","url":"http://www.koppenelectro.nl/"},
            {"slug":"e-install","name":"E-Install Elektrotechniek","city":"De Meern","url":"https://e-install.com/"},
            {"slug":"van-zoelen","name":"Van Zoelen Loodgieters Dakdekkers","city":"Vleuten","url":"https://vanzoelenloodgieters.nl/"},
            {"slug":"van-santen","name":"Van Santen Vloerverwarming","city":"Utrecht","url":"https://warmevloer.nl/"},
            {"slug":"smit","name":"Smit Installatietechniek BV","city":"Utrecht","url":"http://www.smit-installatietechniek.nl"},
            {"slug":"gerssen","name":"Gerssen Elektrotechniek","city":"De Meern","url":"http://www.gerssenvanschaik.nl/"},
            {"slug":"energiek","name":"Energiek Installaties","city":"Vleuten","url":"http://www.nrgk.nl/"},
            {"slug":"jansen","name":"Jansen Installatiebedrijf","city":"Utrecht","url":"http://www.janseninstal.nl/"}
          ]
          JSON
          python - <<'PY'
          import json, pathlib, subprocess, time
          candidates=json.loads(pathlib.Path('audit-pool/candidates.json').read_text())
          exe='/tmp/pitch-doctor/.venv/bin/pitch-doctor'
          results=[]
          for c in candidates:
              out=pathlib.Path('audit-pool/raw')/c['slug']
              out.mkdir(parents=True, exist_ok=True)
              cmd=[exe,'scan',c['url'],'--business-name',c['name'],'--city',c['city'],'--lang','en','--out',str(out),'--json']
              started=time.monotonic()
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=240)
                  elapsed=round(time.monotonic()-started,2)
                  (out/'stdout.txt').write_text(p.stdout,encoding='utf-8',errors='replace')
                  (out/'stderr.txt').write_text(p.stderr,encoding='utf-8',errors='replace')
                  json_files=sorted(out.glob('*.json'),key=lambda x:x.stat().st_mtime,reverse=True)
                  summary={"slug":c['slug'],"name":c['name'],"url":c['url'],"exit_code":p.returncode,"seconds":elapsed,"raw_json":str(json_files[0]) if json_files else None}
                  if json_files:
                      raw=json.loads(json_files[0].read_text(encoding='utf-8'))
                      summary.update({"score":raw.get('score'),"grade":raw.get('grade'),"checks":len(raw.get('checks') or [])})
                  results.append(summary)
              except subprocess.TimeoutExpired as e:
                  elapsed=round(time.monotonic()-started,2)
                  (out/'stderr.txt').write_text(f'TIMEOUT after {elapsed}s\n{e}',encoding='utf-8')
                  results.append({"slug":c['slug'],"name":c['name'],"url":c['url'],"exit_code":"timeout","seconds":elapsed,"raw_json":None})
          pathlib.Path('audit-pool/summary.json').write_text(json.dumps(results,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(results,indent=2,ensure_ascii=False))
          if sum(1 for r in results if r.get('raw_json')) < 5:
              raise SystemExit('Fewer than five candidates produced auditable raw JSON')
          PY

      - name: Upload raw audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate3-audit-pool
          path: audit-pool
          retention-days: 14
