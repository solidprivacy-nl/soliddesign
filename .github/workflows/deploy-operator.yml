name: Deploy Operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "prompts/**"
      - "sector-intelligence/**"
      - ".github/workflows/deploy-operator.yml"
  pull_request:
    paths:
      - "operator/**"
      - "prompts/**"
      - "sector-intelligence/**"
      - ".github/workflows/deploy-operator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Enforce private source repository for production
        if: github.event_name == 'push'
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error::Production AI-boundary promotion requires the SolidDesign source repository to be private."
            exit 1
          fi
      - name: Ensure one Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: soliddesign-cms
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$status" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" > /tmp/project-created.json
          elif [ "$status" != "200" ]; then
            cat /tmp/project.json
            exit 1
          fi
      - name: Select deployment branch
        id: deployment
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=manual-preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage canonical design resources
        id: stage
        run: |
          set -euo pipefail
          rm -rf operator/prompts operator/sector-intelligence
          cp -R prompts operator/prompts
          cp -R sector-intelligence operator/sector-intelligence
          proof=$(openssl rand -hex 16)
          printf '%s\n' "$proof" > operator/deployment-proof.txt
          echo "proof=$proof" >> "$GITHUB_OUTPUT"
      - name: Deploy Operator
        working-directory: operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ steps.deployment.outputs.branch }}
        run: npx --yes wrangler@4 pages deploy . --project-name soliddesign-cms --branch "$DEPLOY_BRANCH"
      - name: Smoke-test deployed delivery
        env:
          DEPLOY_BRANCH: ${{ steps.deployment.outputs.branch }}
          EXPECTED_DEPLOY_PROOF: ${{ steps.stage.outputs.proof }}
          SUPABASE_URL: https://grderdhnjkeucaaehgqy.supabase.co
          SMOKE_SLUG: siberg
          LEGACY_SMOKE_SLUG: koppen-electro-techniek
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BASE_URL="https://soliddesign-cms.pages.dev"
          else
            BASE_URL="https://${DEPLOY_BRANCH}.soliddesign-cms.pages.dev"
          fi

          # Pages can report a deployment complete slightly before the stable hostname
          # serves that exact deployment. Wait on an opaque per-deployment proof before
          # running content assertions so a stale alias cannot produce a false result.
          ready=0
          for attempt in $(seq 1 30); do
            actual=$(curl -fsS --max-time 5 \
              "$BASE_URL/deployment-proof.txt?proof=$EXPECTED_DEPLOY_PROOF" 2>/dev/null \
              | tr -d '\r\n' || true)
            if [ "$actual" = "$EXPECTED_DEPLOY_PROOF" ]; then
              ready=1
              break
            fi
            echo "Waiting for deployed hostname to converge (attempt $attempt/30)."
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Deployed hostname did not converge to this deployment within the bounded wait."
            exit 1
          fi

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/" -o /tmp/operator.html
          grep -q 'SolidDesign' /tmp/operator.html

          # Production and previews must bootstrap access from active team membership only.
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/app.js" -o /tmp/app.js
          grep -q "from('team_members')" /tmp/app.js
          grep -q "eq('active', true)" /tmp/app.js
          ! grep -q 'operator_allowlist' /tmp/app.js

          # Design methodology and Sector Intelligence are served through the CMS origin.
          # The AI-facing contract must stay provider-blind so a clean ChatGPT run does not
          # need repository or infrastructure discovery.
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/start-design" -o /tmp/start-design.html
          grep -q '/prompts/SOLIDDESIGN_BOOTSTRAP.md' /tmp/start-design.html
          grep -q 'Implementation boundary:' /tmp/start-design.html
          grep -q 'outside the design contract' /tmp/start-design.html
          ! grep -Eqi 'github\.com|raw\.githubusercontent\.com|api\.github\.com|supabase\.co' /tmp/start-design.html

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prompts/SOLIDDESIGN_BOOTSTRAP.md" -o /tmp/bootstrap.md
          grep -q 'Prompt architecture version.*0.4-preview' /tmp/bootstrap.md
          grep -q 'soliddesign-cms.pages.dev/sector-intelligence/' /tmp/bootstrap.md
          grep -q 'Do not discover, inspect or infer underlying source repositories' /tmp/bootstrap.md
          grep -q 'Do not substitute an implementation-source lookup' /tmp/bootstrap.md
          ! grep -Eqi 'github\.com|raw\.githubusercontent\.com|api\.github\.com|supabase\.co' /tmp/bootstrap.md

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prompts/core/DESIGN_CONSTITUTION.md" -o /tmp/design-constitution.md
          test -s /tmp/design-constitution.md
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/sector-intelligence/README.md" -o /tmp/sector-intelligence-readme.md
          grep -q 'canonical v0.5' /tmp/sector-intelligence-readme.md

          # The centrally injected engagement client must itself be deployed and executable.
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prospect-engagement.js" -o /tmp/prospect-engagement.js
          grep -q '__SOLIDDESIGN_PROSPECT_ENGAGEMENT__' /tmp/prospect-engagement.js

          status=$(curl -sS -o /tmp/missing.html -w '%{http_code}' "$BASE_URL/prospect/does-not-exist/")
          test "$status" = "404"

          # Historical one-segment links are compatibility aliases only. They may never
          # resolve directly to UUID or legacy preview infrastructure.
          curl -sS -D /tmp/root-alias.headers -o /dev/null "$BASE_URL/$SMOKE_SLUG?src=qr"
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/root-alias.headers
          grep -Eqi "^location: .*\/prospect\/$SMOKE_SLUG/\?src=qr" /tmp/root-alias.headers
          ! grep -Eqi '^location: .*\/p\/' /tmp/root-alias.headers
          ! grep -Eqi '^location: https://(gate3-v1\.soliddesign-cms|soliddesign-previews-solidprivacy|gate3-v1\.soliddesign-previews-solidprivacy)\.pages\.dev' /tmp/root-alias.headers

          curl -sS -D /tmp/canonical.headers -o /dev/null "$BASE_URL/prospect/$SMOKE_SLUG?src=qr"
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/canonical.headers
          grep -Eqi "^location: .*\/prospect\/$SMOKE_SLUG/\?src=qr" /tmp/canonical.headers
          grep -Eqi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/canonical.headers

          curl -fsSL --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prospect/$SMOKE_SLUG/?src=qr" -o /tmp/prospect.html
          grep -q 'soliddesignProspectEngagement' /tmp/prospect.html
          grep -q 'prospect-engagement.js' /tmp/prospect.html

          # Grandfathered compatibility is intentionally finite. While these rows exist,
          # prove one representative legacy LIVE page remains under the public prospect URL.
          curl -sS --retry 5 --retry-delay 1 --retry-all-errors \
            -D /tmp/legacy.headers \
            "$BASE_URL/prospect/$LEGACY_SMOKE_SLUG/?src=qr" \
            -o /tmp/legacy.html
          grep -Eq '^HTTP/[^ ]+ 200' /tmp/legacy.headers
          grep -Eqi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/legacy.headers
          if grep -Eqi '^location: https://(gate3-v1\.soliddesign-cms|soliddesign-previews-solidprivacy|gate3-v1\.soliddesign-previews-solidprivacy)\.pages\.dev' /tmp/legacy.headers; then
            echo 'legacy preview leaked its technical host'
            exit 1
          fi
          grep -q 'soliddesignProspectEngagement' /tmp/legacy.html

          for function_name in team-invite team-member-admin prospect-engagement; do
            curl -sS -D "/tmp/${function_name}.headers" -o "/tmp/${function_name}.body" \
              -X OPTIONS "$SUPABASE_URL/functions/v1/$function_name" \
              -H "Origin: $BASE_URL" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type'
            grep -Eq '^HTTP/[^ ]+ 2[0-9][0-9]' "/tmp/${function_name}.headers"
            grep -Eqi '^access-control-allow-origin:' "/tmp/${function_name}.headers"
          done
      - name: Deploy legacy preview alias
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name soliddesign-cms --branch gate3-v1
