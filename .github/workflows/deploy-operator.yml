name: Deploy Operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "prompts/**"
      - ".github/workflows/deploy-operator.yml"
  pull_request:
    paths:
      - "operator/**"
      - "prompts/**"
      - ".github/workflows/deploy-operator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Ensure one Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: soliddesign-cms
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$status" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" > /tmp/project-created.json
          elif [ "$status" != "200" ]; then
            cat /tmp/project.json
            exit 1
          fi
      - name: Select deployment branch
        id: deployment
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=manual-preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage canonical design resources
        id: stage
        run: |
          set -euo pipefail
          rm -rf operator/prompts operator/sector-intelligence
          cp -R prompts operator/prompts
          proof=$(openssl rand -hex 16)
          printf '%s\n' "$proof" > operator/deployment-proof.txt
          echo "proof=$proof" >> "$GITHUB_OUTPUT"
      - name: Deploy Operator
        working-directory: operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ steps.deployment.outputs.branch }}
        run: npx --yes wrangler@4 pages deploy . --project-name soliddesign-cms --branch "$DEPLOY_BRANCH"
      - name: Smoke-test deployed delivery
        env:
          DEPLOY_BRANCH: ${{ steps.deployment.outputs.branch }}
          EXPECTED_DEPLOY_PROOF: ${{ steps.stage.outputs.proof }}
          SUPABASE_URL: https://grderdhnjkeucaaehgqy.supabase.co
          SMOKE_SLUG: siberg
          LEGACY_SMOKE_SLUG: koppen-electro-techniek
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BASE_URL="https://soliddesign-cms.pages.dev"
          else
            BASE_URL="https://${DEPLOY_BRANCH}.soliddesign-cms.pages.dev"
          fi

          ready=0
          for attempt in $(seq 1 30); do
            actual=$(curl -fsS --max-time 5 \
              "$BASE_URL/deployment-proof.txt?proof=$EXPECTED_DEPLOY_PROOF" 2>/dev/null \
              | tr -d '\r\n' || true)
            if [ "$actual" = "$EXPECTED_DEPLOY_PROOF" ]; then
              ready=1
              break
            fi
            echo "Waiting for deployed hostname to converge (attempt $attempt/30)."
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Deployed hostname did not converge to this deployment within the bounded wait."
            exit 1
          fi

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/" -o /tmp/operator.html
          grep -q 'SolidDesign' /tmp/operator.html

          # Bedrijven zoeken remains one task with three progressive modes.
          grep -q 'data-discovery-mode="research"' /tmp/operator.html
          grep -q 'data-discovery-mode="area"' /tmp/operator.html
          grep -q 'data-discovery-mode="url"' /tmp/operator.html
          grep -q 'Gericht zoeken' /tmp/operator.html
          grep -q 'Breed zoeken' /tmp/operator.html
          grep -q 'Bekend bedrijf' /tmp/operator.html
          ! grep -q 'Max. resultaten' /tmp/operator.html

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/research-discovery.js" -o /tmp/research-discovery.js
          grep -q '1. Kopieer opdracht' /tmp/research-discovery.js
          grep -q '2. Importeer resultaat' /tmp/research-discovery.js
          grep -q 'enriched_count' /tmp/research-discovery.js
          grep -q 'canonical_sector_key: context.canonicalKey' /tmp/research-discovery.js

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/discovery-sectors.js" -o /tmp/discovery-sectors.js
          grep -q '/api/resolve-sector' /tmp/discovery-sectors.js
          grep -q 'SOLIDDESIGN_RESOLVE_SINGLE_SECTOR' /tmp/discovery-sectors.js

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/discovery-triage.js" -o /tmp/discovery-triage.js
          grep -q 'KANSRIJK' /tmp/discovery-triage.js
          grep -q 'NOG BEOORDELEN' /tmp/discovery-triage.js
          grep -q 'Waarom?' /tmp/discovery-triage.js
          grep -q 'Toevoegen' /tmp/discovery-triage.js
          ! grep -q 'Basischeck OK' /tmp/discovery-triage.js

          # Prospect-first Design: one operator action, no sector-design machinery.
          grep -q 'Kopieer designopdracht' /tmp/operator.html
          grep -q 'Designinstructie' /tmp/operator.html
          grep -q 'Projectinstellingen' /tmp/operator.html
          grep -q 'Upload concept' /tmp/operator.html
          grep -q 'Gebruik externe conceptlink' /tmp/operator.html
          ! grep -q 'Sectoronderzoek' /tmp/operator.html
          ! grep -q 'copySectorUpgrade' /tmp/operator.html
          ! grep -q 'sector-intelligence-ui.js' /tmp/operator.html
          ! grep -q 'sector-link-suggestions.js' /tmp/operator.html

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/design-process.js" -o /tmp/design-process.js
          grep -q 'Brief format version:.*0.4' /tmp/design-process.js
          grep -q '✓ Designopdracht gekopieerd' /tmp/design-process.js
          ! grep -qi 'sector-intelligence' /tmp/design-process.js
          ! grep -q 'canonical_sector_key' /tmp/design-process.js

          # Production and previews bootstrap access from active team membership only.
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/app.js" -o /tmp/app.js
          grep -q "from('team_members')" /tmp/app.js
          grep -q "eq('active', true)" /tmp/app.js
          ! grep -q 'operator_allowlist' /tmp/app.js

          # Design methodology, operator prompts and research contracts are served through one CMS origin.
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/start-design" -o /tmp/start-design.html
          grep -q '/prompts/SOLIDDESIGN_BOOTSTRAP.md' /tmp/start-design.html
          grep -q 'Prompt architecture version: 0.4' /tmp/start-design.html
          ! grep -qi 'Sector Intelligence' /tmp/start-design.html
          ! grep -Eqi 'github\.com|raw\.githubusercontent\.com' /tmp/start-design.html

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prompts/SOLIDDESIGN_BOOTSTRAP.md" -o /tmp/bootstrap.md
          grep -q 'Prompt architecture version.*0.4' /tmp/bootstrap.md
          grep -q 'Design the actual prospect' /tmp/bootstrap.md
          ! grep -qi 'sector-intelligence' /tmp/bootstrap.md
          ! grep -q 'prompts/sectors' /tmp/bootstrap.md
          ! grep -Eqi 'github\.com|raw\.githubusercontent\.com' /tmp/bootstrap.md

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prompts/core/DESIGN_CONSTITUTION.md" -o /tmp/design-constitution.md
          test -s /tmp/design-constitution.md

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prompts/library/prospect-research.md" -o /tmp/prospect-research.md
          grep -q 'SolidDesign Prospect Design Opportunity Research' /tmp/prospect-research.md
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prompts/library/website-design.md" -o /tmp/website-design.md
          grep -q 'website-design' /tmp/website-design.md || grep -q 'Website' /tmp/website-design.md
          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prompts/contracts/prospect-research-import-v1.json" -o /tmp/prospect-research-contract.json
          grep -q 'prospect-research-import-v1' /tmp/prospect-research-contract.json
          grep -q 'triage_decision' /tmp/prospect-research-contract.json

          # Retired Sector Intelligence is not deployed as an active resource.
          sector_status=$(curl -sS -o /tmp/sector-retired.body -w '%{http_code}' "$BASE_URL/sector-intelligence/README.md")
          test "$sector_status" = "404"

          # Prompt repository writes are production-only, never PR-preview capability.
          prompt_write_status=$(curl -sS -o /tmp/prompt-write.body -w '%{http_code}' \
            -X POST "$BASE_URL/api/prompt-library" \
            -H 'Content-Type: application/json' \
            --data '{"action":"save"}')
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$prompt_write_status" = "403"
            grep -q 'productie-CMS' /tmp/prompt-write.body
          else
            test "$prompt_write_status" = "401"
          fi

          curl -fsS --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prospect-engagement.js" -o /tmp/prospect-engagement.js
          grep -q '__SOLIDDESIGN_PROSPECT_ENGAGEMENT__' /tmp/prospect-engagement.js

          status=$(curl -sS -o /tmp/missing.html -w '%{http_code}' "$BASE_URL/prospect/does-not-exist/")
          test "$status" = "404"

          curl -sS -D /tmp/root-alias.headers -o /dev/null "$BASE_URL/$SMOKE_SLUG?src=qr"
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/root-alias.headers
          grep -Eqi "^location: .*\/prospect\/$SMOKE_SLUG/\?src=qr" /tmp/root-alias.headers
          ! grep -Eqi '^location: .*\/p\/' /tmp/root-alias.headers
          ! grep -Eqi '^location: https://(gate3-v1\.soliddesign-cms|soliddesign-previews-solidprivacy|gate3-v1\.soliddesign-previews-solidprivacy)\.pages\.dev' /tmp/root-alias.headers

          curl -sS -D /tmp/canonical.headers -o /dev/null "$BASE_URL/prospect/$SMOKE_SLUG?src=qr"
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/canonical.headers
          grep -Eqi "^location: .*\/prospect\/$SMOKE_SLUG/\?src=qr" /tmp/canonical.headers
          grep -Eqi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/canonical.headers

          curl -fsSL --retry 5 --retry-delay 1 --retry-all-errors "$BASE_URL/prospect/$SMOKE_SLUG/?src=qr" -o /tmp/prospect.html
          grep -q 'soliddesignProspectEngagement' /tmp/prospect.html
          grep -q 'prospect-engagement.js' /tmp/prospect.html

          curl -sS --retry 5 --retry-delay 1 --retry-all-errors \
            -D /tmp/legacy.headers \
            "$BASE_URL/prospect/$LEGACY_SMOKE_SLUG/?src=qr" \
            -o /tmp/legacy.html
          grep -Eq '^HTTP/[^ ]+ 200' /tmp/legacy.headers
          grep -Eqi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/legacy.headers
          if grep -Eqi '^location: https://(gate3-v1\.soliddesign-cms|soliddesign-previews-solidprivacy|gate3-v1\.soliddesign-previews-solidprivacy)\.pages\.dev' /tmp/legacy.headers; then
            echo 'legacy preview leaked its technical host'
            exit 1
          fi
          grep -q 'soliddesignProspectEngagement' /tmp/legacy.html

          for function_name in team-invite team-member-admin prospect-engagement; do
            curl -sS -D "/tmp/${function_name}.headers" -o "/tmp/${function_name}.body" \
              -X OPTIONS "$SUPABASE_URL/functions/v1/$function_name" \
              -H "Origin: $BASE_URL" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,apikey,content-type'
            grep -Eq '^HTTP/[^ ]+ 2[0-9][0-9]' "/tmp/${function_name}.headers"
            grep -Eqi '^access-control-allow-origin:' "/tmp/${function_name}.headers"
          done
      - name: Deploy legacy preview alias
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name soliddesign-cms --branch gate3-v1
