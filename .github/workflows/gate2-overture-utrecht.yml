name: Gate 2 Overture Utrecht Probe

on:
  push:
    branches:
      - gate2/overture-utrecht

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SolidDesign
        run: python -m pip install -e .

      - name: Query Overture Utrecht
        run: |
          mkdir -p artifacts/gate2
          soliddesign discover \
            --bbox '5.02,52.02,5.24,52.17' \
            --limit 500 \
            --out artifacts/gate2/overture-utrecht.json \
            > artifacts/gate2/overture-utrecht.stdout.json

      - name: Analyze Dutch discovery quality and installation candidates
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path('artifacts/gate2/overture-utrecht.json')
          rows = json.loads(path.read_text(encoding='utf-8'))

          def domain(url):
              try:
                  return (urlsplit(url).hostname or '').lower().removeprefix('www.')
              except Exception:
                  return ''

          domains = [domain(r.get('website_url','')) for r in rows]
          duplicate_domains = {d:c for d,c in Counter(domains).items() if d and c > 1}
          categories = Counter((r.get('category') or '').lower() for r in rows)
          cities = Counter((r.get('city') or '').lower() for r in rows)

          install_terms = re.compile(
              r'(install|elektr|electr|loodgiet|plumb|verwarm|heating|hvac|klimaat|airco|cv\b|warmtepomp|heat.?pump|solar|zonne|dak|roof|sanitair|ventilat)',
              re.I,
          )
          candidates = []
          for r in rows:
              haystack = ' '.join([
                  r.get('name') or '',
                  r.get('category') or '',
                  r.get('website_url') or '',
              ])
              if install_terms.search(haystack):
                  candidates.append(r)

          report = {
              'bbox': '5.02,52.02,5.24,52.17',
              'records_with_websites': len(rows),
              'unique_website_domains': len({d for d in domains if d}),
              'duplicate_domain_count': len(duplicate_domains),
              'duplicate_domains': duplicate_domains,
              'top_categories': categories.most_common(50),
              'top_cities': cities.most_common(30),
              'installation_keyword_candidates': len(candidates),
              'discovery_versions': sorted({r.get('discovery_version') for r in rows if r.get('discovery_version')}),
              'sources': sorted({r.get('discovery_source') for r in rows if r.get('discovery_source')}),
          }
          Path('artifacts/gate2/report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')
          Path('artifacts/gate2/installation-candidates.json').write_text(json.dumps(candidates, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Upload Gate 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate2-overture-utrecht
          path: artifacts/gate2/
          retention-days: 14
