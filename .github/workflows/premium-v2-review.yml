name: Premium v2 five visual review

on:
  push:
    branches: ["design/premium-v2"]

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install bounded review tooling
        run: |
          python -m pip install -e .
          npm install --no-save playwright@1.59.1 impeccable@3.6.0
          npx playwright install --with-deps chromium
      - name: Download frozen Gate-3 five-prospect evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/solidprivacy-nl/soliddesign/actions/artifacts/9582667669/zip" \
            -o /tmp/gate3.zip
          mkdir gate3-source
          unzip -q /tmp/gate3.zip -d gate3-source
          test -s gate3-source/energiek/prospect.json
      - name: Rebuild the same five with premium-v2
        run: |
          mkdir -p premium-v2-review
          for slug in koppen e-install energiek jansen akta; do
            mkdir -p "premium-v2-review/$slug/proof"
            soliddesign assemble \
              --prospect "gate3-source/$slug/prospect.json" \
              --audit "gate3-source/$slug/audit.json" \
              --score "gate3-source/$slug/score.json" \
              --out "premium-v2-review/$slug/proof" \
              --preview-url "https://preview.example.invalid/p/$slug"
            npx impeccable@3.6.0 detect --json "premium-v2-review/$slug/proof/preview.html" > "premium-v2-review/$slug/impeccable.json"
            test "$(cat "premium-v2-review/$slug/impeccable.json")" = "[]"
          done
      - name: Screenshot desktop and mobile
        run: |
          cat > screenshot.mjs <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'url';
          import path from 'path';
          const browser = await chromium.launch({headless:true});
          for (const slug of ['koppen','e-install','energiek','jansen','akta']) {
            const file = path.resolve(`premium-v2-review/${slug}/proof/preview.html`);
            for (const [size,width,height] of [['desktop',1440,1000],['mobile',390,844]]) {
              const page = await browser.newPage({viewport:{width,height}});
              await page.goto(pathToFileURL(file).href);
              await page.screenshot({path:`premium-v2-review/${slug}/${size}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          JS
          node screenshot.mjs
          rm screenshot.mjs
          for slug in koppen e-install energiek jansen akta; do
            test -s "premium-v2-review/$slug/desktop.png"
            test -s "premium-v2-review/$slug/mobile.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: premium-v2-five-visual-review
          path: premium-v2-review
          retention-days: 14
