[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soliddesign"
version = "0.2.0"
description = "Reuse-first website growth engine with Overture-first discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.5",
  "segno==1.6.6",
]

[project.scripts]
soliddesign = "soliddesign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soliddesign = ["py.typed"]
